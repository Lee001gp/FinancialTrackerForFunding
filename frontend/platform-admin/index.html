<!doctype html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Platform Admin</title><link rel='manifest' href='manifest.json'><style>body{font-family:Arial;margin:0;background:#f4f6f8}header{background:#0f3d57;color:#fff;padding:12px}.grid{display:grid;gap:12px;padding:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{border:1px solid #ddd;border-radius:10px;padding:12px;background:#fff}input,button,textarea{width:100%;padding:10px;margin:6px 0}.ok{color:#0a7a30;white-space:pre-wrap}</style></head><body><header><h2>Platform Admin Console</h2></header><main class='grid'><section class='card'><h3>Create Tenant</h3><input id='tenantId' placeholder='Tenant UUID'><input id='tenantName' placeholder='Tenant Name'><button id='createTenant'>Create</button></section><section class='card'><h3>Create Platform User</h3><input id='platformEmail' placeholder='Email'><input id='platformPassword' placeholder='Password'><button id='createUser'>Create Platform Admin</button></section><section class='card'><h3>System Health</h3><button id='healthBtn'>Refresh Health</button><p id='status' class='ok'></p></section><section class='card'><h3>Global Settings</h3><textarea id='settingsJson' rows='5' placeholder='[{"settingKey":"max_upload_mb","settingValue":{"value":10}}]'></textarea><button id='saveSettings'>Save Settings</button><button id='loadAudit'>Load Platform Audit</button></section></main><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');const status=document.getElementById('status');const auth='Bearer demo';const call=(u,o={})=>fetch(u,{...o,headers:{'content-type':'application/json',authorization:auth,...(o.headers||{})}});document.getElementById('createTenant').onclick=async()=>{try{await call('/platform/tenants',{method:'POST',body:JSON.stringify({id:document.getElementById('tenantId').value,name:document.getElementById('tenantName').value})});status.innerText='Tenant request sent';}catch(e){status.innerText='Tenant request pending';}};document.getElementById('createUser').onclick=async()=>{try{await call('/platform/users',{method:'POST',body:JSON.stringify({email:document.getElementById('platformEmail').value,password:document.getElementById('platformPassword').value,roles:['platform_admin']})});status.innerText='Platform user request sent';}catch(e){status.innerText='Platform user request pending';}};document.getElementById('healthBtn').onclick=async()=>{try{const r=await call('/platform/health');status.innerText=JSON.stringify(await r.json(),null,2);}catch(e){status.innerText='Health check pending';}};document.getElementById('saveSettings').onclick=async()=>{try{const items=JSON.parse(document.getElementById('settingsJson').value||'[]');await call('/platform/settings',{method:'PUT',body:JSON.stringify(items)});status.innerText='Settings saved request sent';}catch(e){status.innerText='Settings save failed/pending';}};document.getElementById('loadAudit').onclick=async()=>{try{const r=await call('/platform/audit?limit=20');status.innerText=JSON.stringify(await r.json(),null,2);}catch(e){status.innerText='Audit load pending';}};</script></body></html>
