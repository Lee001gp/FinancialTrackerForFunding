<!doctype html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Platform Admin</title><link rel='manifest' href='manifest.json'><style>body{font-family:Arial;margin:0;background:#f4f6f8}header{background:#0f3d57;color:#fff;padding:12px}.grid{display:grid;gap:12px;padding:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{border:1px solid #ddd;border-radius:10px;padding:12px;background:#fff}input,button{width:100%;padding:10px;margin:6px 0}.ok{color:#0a7a30}</style></head><body><header><h2>Platform Admin Console</h2></header><main class='grid'><section class='card'><h3>Create Tenant</h3><input id='tenantId' placeholder='Tenant UUID'><input id='tenantName' placeholder='Tenant Name'><button id='createTenant'>Create</button></section><section class='card'><h3>Create Platform User</h3><input id='platformEmail' placeholder='Email'><input id='platformPassword' placeholder='Password'><button id='createUser'>Create Platform Admin</button></section><section class='card'><h3>System Health</h3><p>DB connectivity, queue depth, and storage usage widgets.</p><p id='status' class='ok'></p></section></main><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');const status=document.getElementById('status');document.getElementById('createTenant').onclick=async()=>{try{await fetch('/platform/tenants',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer demo'},body:JSON.stringify({id:document.getElementById('tenantId').value,name:document.getElementById('tenantName').value})});status.innerText='Tenant request sent';}catch(e){status.innerText='Tenant request pending';}};document.getElementById('createUser').onclick=async()=>{try{await fetch('/platform/users',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer demo'},body:JSON.stringify({email:document.getElementById('platformEmail').value,password:document.getElementById('platformPassword').value,roles:['platform_admin']})});status.innerText='Platform user request sent';}catch(e){status.innerText='Platform user request pending';}};</script></body></html>
