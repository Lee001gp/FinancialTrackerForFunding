<!doctype html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Tenant Portal</title><link rel='manifest' href='manifest.json'><style>body{font-family:Arial;margin:0;background:#f4f6f8}header{background:#135e96;color:#fff;padding:12px}.grid{display:grid;gap:12px;padding:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.card{border:1px solid #ddd;border-radius:10px;padding:12px;background:#fff}input,select,button{width:100%;padding:10px;margin:6px 0}.ok{color:#0a7a30}</style></head><body><header><h2>Tenant Operations Portal</h2></header><main class='grid'><section class='card'><h3>Review Queue Filters</h3><select id='program'><option>Program</option></select><select id='allocation'><option>Allocation</option></select><select id='counterparty'><option>Counterparty</option></select><button id='apply'>Apply Filters</button></section><section class='card'><h3>Tenant Config Console</h3><input id='termKey' placeholder='Term key (e.g. allocation)'><input id='termLabel' placeholder='Label (e.g. Project Budget)'><button id='saveTerm'>Save Terminology</button><input id='catName' placeholder='Category Name'><input id='catCode' placeholder='Category Code'><button id='saveCategory'>Save Category</button></section><section class='card'><h3>Compliance Cases</h3><input id='caseTitle' placeholder='Case title'><button id='createCase'>Create Case</button><p id='status' class='ok'></p></section></main><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');const status=document.getElementById('status');const h={method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer demo'}};document.getElementById('saveTerm').onclick=async()=>{try{await fetch('/tenant-config/terms',{...h,body:JSON.stringify([{termKey:document.getElementById('termKey').value,label:document.getElementById('termLabel').value}])});status.innerText='Term saved request sent';}catch(e){status.innerText='Term save pending';}};document.getElementById('saveCategory').onclick=async()=>{try{await fetch('/tenant-config/categories',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer demo'},body:JSON.stringify({name:document.getElementById('catName').value,code:document.getElementById('catCode').value,kind:'expense'})});status.innerText='Category saved request sent';}catch(e){status.innerText='Category save pending';}};document.getElementById('createCase').onclick=async()=>{try{await fetch('/compliance/cases',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer demo'},body:JSON.stringify({title:document.getElementById('caseTitle').value,source:'manual'})});status.innerText='Case request sent';}catch(e){status.innerText='Case create pending';}};document.getElementById('apply').onclick=()=>status.innerText='Filters applied locally';</script></body></html>
